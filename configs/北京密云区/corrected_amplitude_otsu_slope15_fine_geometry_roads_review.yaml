input:
  bands:
    VV: 1
threshold:
  method: otsu
  otsu_domain: log_amplitude
  otsu_log_floor: 1.0e-06
  water_percent: 30
  mode: bottom
  otsu_bins: 1024
  otsu_histogram_percentiles: null
