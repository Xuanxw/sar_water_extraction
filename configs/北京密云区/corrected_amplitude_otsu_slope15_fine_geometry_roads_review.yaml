# OSM道路冲突核验专用：不删除或修改任何水体；保持5米几何和15度坡度规则。
# OSM_CACHE_DIR为跨日期/跨景共享缓存；首次串行下载，完整瓦片续跑复用。
# road_review.width_by_class_m为缺少OSM宽度时的总宽假设，不是实测道路宽度。
# 缓冲半径=OSM/等级总宽的一半+extra_buffer_m；桥梁/隧道仍输出供人工判断。
# 三波段road_conflict.tif依次对应原阈值候选、辅助修正后、最终成面水体。
# 只读复用已完成的5米基线前置数据及几何；未完成阶段在本轮独立计算，不等待固定景数。
