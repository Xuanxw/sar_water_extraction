<rect x="442" y="440" width="37" height="26" rx="3" fill="#f8e8cf" stroke="#627888"/>
<text x="460.5" y="458" text-anchor="middle" class="n">D2</text>
<path d="M120 453H439" fill="none" stroke="#415364" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#tip)"/>
<path d="M103 466L129 486" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<path d="M431 488L446 468" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<rect x="130" y="477" width="37" height="26" rx="3" fill="#deebf5" stroke="#627888"/>
<text x="148.5" y="495" text-anchor="middle" class="n">E3</text>
<rect x="395" y="477" width="37" height="26" rx="3" fill="#f8e8cf" stroke="#627888"/>
<text x="413.5" y="495" text-anchor="middle" class="n">D3</text>
<path d="M167 490H392" fill="none" stroke="#415364" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#tip)"/>
<path d="M150 503L176 523" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<path d="M384 525L399 505" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<rect x="177" y="514" width="37" height="26" rx="3" fill="#deebf5" stroke="#627888"/>
<text x="195.5" y="532" text-anchor="middle" class="n">E4</text>
<rect x="348" y="514" width="37" height="26" rx="3" fill="#f8e8cf" stroke="#627888"/>
<text x="366.5" y="532" text-anchor="middle" class="n">D4</text>
<path d="M214 527H345" fill="none" stroke="#415364" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#tip)"/>
<rect x="234" y="553" width="105" height="35" rx="3" fill="#dbede3" stroke="#627888"/>
<text x="286.5" y="575.5" text-anchor="middle" class="n">Center</text>
<path d="M208 541L236 558" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<path d="M339 569L362 542" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<text x="24" y="615" text-anchor="start" class="s">E = encoder     D = decoder     Dashed arrows = skip connections</text>
<text x="623" y="346" text-anchor="start" class="h">C   UAFNet</text>
<text x="623" y="373" text-anchor="start" class="s">Four scales feed both coarse prediction and refinement</text>
<rect x="625" y="403" width="163" height="45" rx="3" fill="#deebf5" stroke="#627888"/>
<text x="706.5" y="430.5" text-anchor="middle" class="n">PVT / ResNet50</text>
