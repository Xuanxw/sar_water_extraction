# 通用离线val阈值配置；密云ORG案例见configs/北京密云区/threshold_segmentation.yaml。
paths:
  # 数据搬迁后只修改本项；其余相对路径以此目录为基准。
  DATA_ROOT: I:\水体数据
  IMAGE_DIR: processed_scenes_bat2\normalized\images\val
  LABEL_DIR: processed_scenes_bat2\normalized\labels\val
  SPLIT_MANIFEST: processed_scenes_bat2\normalized\split_manifest.csv
  CACHE_DIR: E:\Code_projects\sar_water_extraction\data_cache\threshold_bc
  AUXILIARY_CACHE_DIR: E:\Code_projects\sar_water_extraction\data_cache\auxiliary
  OUTPUT_ROOT: E:\Code_projects\sar_water_extraction\outputs\thres_seg\quality
  OUTPUT_DIR: null
  REFERENCE_PATH: null
  REFERENCE_COVERAGE_PATH: null
  ELEVATION_PATH: null
run:
  mode: dataset
  data_layout: full_scene
input:
  bands:
    VV: 1
  scene_prefix: null
threshold:
  water_percent: 10
  mode: bottom
  preprocessing: offline_normalized
processing:
  block_size: 1024
auxiliary:
  download_history: false
  download_elevation: false
  worldcover_year: 2021
  buffer_m: 1000.0
  max_tiles_per_scene: 64
  max_mosaic_pixels: 100000000
  timeout: 60
  retries: 3
landcover:
  enabled: false
  band: 5
analysis:
  reference_water_values:
  - 1
  reference_dry_values:
  - 0
  vector_assume_complete: false
  elevation_kind: DEM
  elevation_scale: 1.0
  depth_scope: new_water
  depth_neighbors: 100
  depth_min_boundary: 3
  depth_max_distance_m: 5000.0
  depth_max_pixels: 25000000
output:
  preview_size: 1200
  boundary_radii:
  - 1
  - 3
  - 5
  save_masks: true
  max_visualizations: null
quality_review:
  enabled: true
  points_per_stratum: 50
  boundary_radius_px: 5
  seed: 42
  block_size: 1024
  slope_threshold_deg: 15.0
