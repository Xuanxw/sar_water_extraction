# POSTPROCESS_CHECKPOINTS选择已保存模型；整景模式一次一个模型。
# IMAGE_DIR/LABEL_DIR为null时沿用检查点，可兼容多个manifest的合并路径。
# OUTPUT_DIR为null时创建 模型所在目录/postprocess/时间戳；结果和图件写入其quality下。
# 整景中断续跑：OUTPUT_DIR填同一个postprocess/时间戳目录；配置与模型必须一致。
# opening_radius/closing_radius默认0，即不修改掩膜；单纯评估不等于已启用修正。
