<rect x="819" y="403" width="126" height="45" rx="3" fill="#dbede3" stroke="#627888"/>
<text x="882" y="430.5" text-anchor="middle" class="n">MBDC</text>
<path d="M945 425H980" fill="none" stroke="#415364" stroke-width="1.7" marker-end="url(#tip)"/>
<rect x="983" y="403" width="185" height="45" rx="3" fill="#dbede3" stroke="#627888"/>
