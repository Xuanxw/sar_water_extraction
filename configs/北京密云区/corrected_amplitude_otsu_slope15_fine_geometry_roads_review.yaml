  SNAP_CACHE_DIR: E:\InSAR\水体提取\北京密云区\data_cache\threshold_snap_corrected_amplitude_20261116
  SNAP_WORK_DIR: E:\InSAR\水体提取\北京密云区\data_cache\threshold_snap_corrected_amplitude_work_20261116
  PROFILE_GEOMETRY_CACHE_DIR: E:\InSAR\水体提取\北京密云区\data_cache\geometry_corrected_amplitude_otsu_slope15_fine_geometry_roads_review_20261117
